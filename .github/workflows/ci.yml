name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run Ruff
        run: python -m ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: "3.11"
          - os: windows-2025
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check .
      - name: Run Phase 11 compatibility matrix
        shell: pwsh
        run: .\test-phase11.ps1 -PythonPath (Get-Command python).Source
      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q src
