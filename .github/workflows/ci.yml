name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run end-to-end self-test
        shell: pwsh
        run: .\test.ps1 -PythonPath (Get-Command python).Source
      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q src
