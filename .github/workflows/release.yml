name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and validate portable release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\build.ps1 -Version $version -PythonPath (Get-Command python).Source
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\dist\Codex-Lifeboat-Windows-x64-Portable.zip `
            .\dist\SHA256.txt `
            --verify-tag `
            --generate-notes `
            --title "Codex Lifeboat $env:GITHUB_REF_NAME"
