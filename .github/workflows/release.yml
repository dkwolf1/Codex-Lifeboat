name: Publish Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and validate portable release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\build.ps1 -Version $version -PythonPath (Get-Command python).Source
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./dist/Codex-Lifeboat.exe
            ./dist/Codex-Lifeboat-Windows-x64-Portable.zip
            ./dist/SHA256.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".\docs\releases\$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          gh release create $env:GITHUB_REF_NAME `
            .\dist\Codex-Lifeboat.exe `
            .\dist\Codex-Lifeboat-Windows-x64-Portable.zip `
            .\dist\SHA256.txt `
            --verify-tag `
            --notes-file $notes `
            --prerelease `
            --title "Codex Lifeboat $env:GITHUB_REF_NAME"
